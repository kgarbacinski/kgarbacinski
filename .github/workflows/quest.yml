name: quest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quest
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/quest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          git config user.name "quest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/quest.svg data/followers.json
          git diff --cached --quiet || { git commit -m "quest: $(date -u +%F)"; git push; }
